name: Test and deploy Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      bundle: ${{ steps.bundle.outputs.file }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Identify the production bundle
        id: bundle
        run: |
          bundle="$(basename "$(find dist/assets -name 'index-*.js' -print -quit)")"
          test -n "$bundle"
          echo "file=$bundle" >> "$GITHUB_OUTPUT"
      - name: Check production site in Chrome
        run: |
          if command -v google-chrome > /dev/null; then
            CHROMIUM_PATH="$(command -v google-chrome)" npm run test:browser
          else
            npx playwright-core install --with-deps --only-shell chromium
            npm run test:browser
          fi
      - name: Package Pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public response
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          BUNDLE: ${{ needs.build.outputs.bundle }}
        run: |
          for attempt in {1..12}; do
            if curl -fsSL --max-time 10 "$PAGE_URL" -o landing.html &&
               grep -Fq "$BUNDLE" landing.html; then
              exit 0
            fi
            sleep 5
          done
          echo "The published bundle did not match this build"
          exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify uploads and scoring on public Pages
        env:
          BENCHMARK_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if command -v google-chrome > /dev/null; then
            CHROMIUM_PATH="$(command -v google-chrome)" npm run test:browser
          else
            npx playwright-core install --with-deps --only-shell chromium
            npm run test:browser
          fi
